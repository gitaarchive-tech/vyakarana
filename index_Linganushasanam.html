ामानि नपुंसके च\n८६. योपधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3"}, {"id": "B_000089", "originalText": "८७. किसलयहृदयेन्द्रियोत्तरीयाणि नपुंसके।", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3"}, {"id": "B_000090", "originalText": "८८. गोमयकषायमलयान्वयाव्ययानि नपुंसके च।", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3"}, {"id": "B_000091", "originalText": "८९. रोपधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3"}, {"id": "B_000092", "originalText": "९०. द्वाराग्रस्फारतक्रवक्रवप्रक्षिप्रक्षुद्रच्छिद्रनारतीरदूर—\n कृच्छ्ररन्ध्रास्रशुभ्रभीरगभीरक्रूरविचित्रकेयूर—\n केदारोदराजस्रशरीरकन्दरपञ्जराजरजठराजिरवैरचामर—\n पुष्करगह्वरकुहरकुटीरकुलीरचत्वरकाश्मीरनीराम्बरशिशिर—\n तन्त्रयन्त्रक्षत्रक्षेत्रमित्रकलत्रच्छत्रमूत्रसूत्रवक्त्र—\n नेत्रगोत्राङ्गुलित्रतनुत्रास्त्रशस्त्रशास्त्रवस्त्रपत्रपात्र—\n नक्षत्राणि नपुंसके।", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3"}, {"id": "B_000093", "originalText": "(क्वचित् नार स्थाने पार, अस्र स्थाने अश्र,\n शुभ्र स्थाने श्वभ्र, तनुत्र स्थाने भलत्र।", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3"}, {"id": "B_000094", "originalText": "क्वचिन्न कुहर)\n\n९१. शुक्रमदेवतायाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3"}, {"id": "B_000095", "originalText": "९२. चक्रवज्रान्धकारसारावारपारक्षीरतोमरश‍ृङ्गारभृङ्गार—\n मन्दारोशीरतिमिरशिशिराणि नपुंसके च।", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3"}, {"id": "B_000096", "originalText": "९३. षोपधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3"}, {"id": "B_000097", "originalText": "९४. शिरीषर्जीषाम्बरीषपीयूषपुरीषकिल्विषकल्मषाणि नपुंसके।", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3"}, {"id": "B_000098", "originalText": "(ऋजीष स्थाने जोष इति केचित्)\n९५. यूषकरीषमिषविषवर्षाणि नपुंसके च।", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3"}, {"id": "B_000099", "originalText": "९६. सोपधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3"}, {"id": "B_000100", "originalText": "९७. मानसबिसबुससाहसानि नपुंसके।", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3"}, {"id": "B_000101", "originalText": "(मानस स्थाने पनस इति क्वचित्)\n९८. चमसांसरसनिर्यासोपवासकार्पासवासमासकासकांसमांसानि नपुंसके च।", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3"}, {"id": "B_000102", "originalText": "(चमसांसरस स्थाने चमससरस इति क्वचितपाठः)\n९९. कंसं चाप्राणिनि।", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3"}, {"id": "B_000103", "originalText": "१००. रश्मिदिवसाभिधानानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3"}, {"id": "B_000104", "originalText": "१०२. दीधितिः स्त्रियाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3"}, {"id": "B_000105", "originalText": "१०२. दिनाहनी नपुंसके।", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3"}, {"id": "B_000106", "originalText": "१०३. मानाभिधानानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3"}, {"id": "B_000107", "originalText": "१०४. द्रोणाढकौ नपुंसके च।", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3"}, {"id": "B_000108", "originalText": "१०५. खारीमानिके स्त्रियाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3"}, {"id": "B_000109", "originalText": "१०६. दाराक्षतलाजासूनां बहुत्वञ्ज।", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3"}, {"id": "B_000110", "originalText": "१०७. नाड्यपजनोपपदानि व्रणाङ्गपदानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3"}, {"id": "B_000111", "originalText": "१०८. मरुद्गरुदुत्तरदृत्विजः।", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3"}, {"id": "B_000112", "originalText": "१०९. ऋषिराशिदृतिग्रन्थिक्रिमिध्वनिबालिकौलिमौलिरविकविकपिमुनयः\n (दृति स्थाने धृति, ग्रन्थि स्थाने प्रहि इति च केचित्)\n११०. ध्वजगजमुञ्जपुञ्जाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3"}, {"id": "B_000113", "originalText": "१११. हस्तकुन्तान्तवातव्रातदूतधूर्तसूतचूतमुहूर्ताः।", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3"}, {"id": "B_000114", "originalText": "११२. षण्डमण्डकरण्डभरण्डवरण्डतुण्डगण्डमुण्डपाषण्डशिखण्डाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3"}, {"id": "B_000115", "originalText": "(रण्ड इत्यपि केचित्)\n११३. वंशांशपुरोडाशाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3"}, {"id": "B_000116", "originalText": "११४. ह्रदकन्दकुन्दबुद्बुदशब्दाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3"}, {"id": "B_000117", "originalText": "११५. अर्घपथिमथ्यृभुक्षिस्तम्बनितम्बपूगाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3"}, {"id": "B_000118", "originalText": "(मथि स्थाने सखि इति केचित्)\n११६. पल्लवपल्वलकफरेफकटाहनिर्व्यूहमठमणितरङ्गतुरङ्ग—\n गन्धस्कन्धमृदङ्गसङ्गसमुद्गपुङ्खाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3"}, {"id": "B_000119", "originalText": "(पल्वल स्थाने पल्लल, निर्व्यूह स्थाने निर्य्यूह च इति केचित्)\n११७. सारथ्यतिथिकुक्षिबस्तिपाण्यञ्जलयः। (क्वचिन्न पाणि)\nइति पुंलिङ्गाधिकारः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3"}, {"id": "B_000120", "originalText": "अथ नपुंसकलिङ्गाधिकारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3"}, {"id": "B_000121", "originalText": "११८. नपुंसकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3"}, {"id": "B_000122", "originalText": "११९. भावे ल्युडन्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3"}, {"id": "B_000123", "originalText": "१२०. निष्ठा च।", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3"}, {"id": "B_000124", "originalText": "१२१. त्वष्यञौ तद्धितौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3"}, {"id": "B_000125", "originalText": "१२२. कर्मणि च ब्राह्मणादिगुणवचनेभ्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3"}, {"id": "B_000126", "originalText": "१२३. यद्यढग्यगञण्वुञ्छाश्च भावकर्म्मणि।", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3"}, {"id": "B_000127", "originalText": "१२४. अव्ययीभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3"}, {"id": "B_000128", "originalText": "१२५. द्वन्द्वैकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3"}, {"id": "B_000129", "originalText": "१२६. अभाषायां हेमन्तशिशिरावहोरात्रे च।", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3"}, {"id": "B_000130", "originalText": "१२७. अनङ्कर्मधारयस्तत्पुरुषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3"}, {"id": "B_000131", "originalText": "१२८. अनल्पे छाया।", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3"}, {"id": "B_000132", "originalText": "१२९. राजाऽमनुष्यपूर्वा सभा।", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3"}, {"id": "B_000133", "originalText": "१३०. सुरासेनाच्छायाशालानिशाः स्त्रियाञ्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3"}, {"id": "B_000134", "originalText": "१३१. परवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000134.mp3"}, {"id": "B_000135", "originalText": "१३२. रात्राह्नाहाः पुंसि।", "padacchedaText": "", "audioFile": "PB_hear2read_000135.mp3"}, {"id": "B_000136", "originalText": "१३३. सङ्ख्यापूर्वा रात्रिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000136.mp3"}, {"id": "B_000137", "originalText": "१३४. अपथपुण्याहे नपुंसके।", "padacchedaText": "", "audioFile": "PB_hear2read_000137.mp3"}, {"id": "B_000138", "originalText": "१३५. द्विगुः स्त्रियाञ्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000138.mp3"}, {"id": "B_000139", "originalText": "१३६. इसुसन्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000139.mp3"}, {"id": "B_000140", "originalText": "१३७. अर्चिः स्त्रियाञ्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3"}, {"id": "B_000141", "originalText": "१३८. छदिः स्त्रियामेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3"}, {"id": "B_000142", "originalText": "१३९. मुखनयनलोहवनमांसरुधिरकार्मुकविवरजलहलधनान्नाभिधानानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3"}, {"id": "B_000143", "originalText": "१४०. सीरार्थौदनाः पुंसि।", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3"}, {"id": "B_000144", "originalText": "१४१. वक्त्रनेत्रारण्यगाण्डीवानि पुंसि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3"}, {"id": "B_000145", "originalText": "१४२. अटवी स्त्रियाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3"}, {"id": "B_000146", "originalText": "१४३. लोपधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3"}, {"id": "B_000147", "originalText": "१४४. तूलोपलतालकुसूलतरलकम्बलदेवलवृषलाः पुंसि।", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3"}, {"id": "B_000148", "originalText": "१४५. शीलमूलमङ्गलसालकमलतलमुसलकुण्डलपललमृणाल—\n बालनिगलपलालबिडालखिलशूलाः पुंसि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3"}, {"id": "B_000149", "originalText": "१४६. शतादिः सङ्ख्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3"}, {"id": "B_000150", "originalText": "१४७. शतायुतप्रयुताः पुंसि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3"}, {"id": "B_000151", "originalText": "१४८. लक्षाकोटी स्त्रियाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3"}, {"id": "B_000152", "originalText": "१४९. शङ्कुः पुंसि।", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3"}, {"id": "B_000153", "originalText": "(केचित् पाठे नैत्तसूत्रम्)\n१५०. सहस्रः पुंसि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3"}, {"id": "B_000154", "originalText": "(केचित् पाठे पुंसि च इति स्थाने क्वचित् इति पाठः)\n१५१. मन् द्व्यच्कोऽकर्त्तरि।", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3"}, {"id": "B_000155", "originalText": "१५२. ब्रह्मन्पुंसि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3"}, {"id": "B_000156", "originalText": "(केचित् पाठे ब्रह्म इत्येव)\n१५३. नामरोमणी नपुंसके।", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3"}, {"id": "B_000157", "originalText": "१५४. असन्तो द्व्यच्कः।", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3"}, {"id": "B_000158", "originalText": "१५५. अप्सराः स्त्रियाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3"}, {"id": "B_000159", "originalText": "१५६. त्रान्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3"}, {"id": "B_000160", "originalText": "१५७. यात्रामात्राभस्त्रादंष्ट्रावस्त्राः स्त्रियामेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3"}, {"id": "B_000161", "originalText": "१५८. भृत्रामित्रच्छात्रपुत्रमन्त्रवृत्रमेढ्रोष्ट्राः पुंसि।", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3"}, {"id": "B_000162", "originalText": "(केचित्पाठे मेढ्रोष्ट्र स्थाने मैत्र इति पाठः)\n१५९. पत्रपात्रपवित्रसूत्रच्छत्राः पुंसि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3"}, {"id": "B_000163", "originalText": "१६०. बलकुसुमशुल्बपत्तनरणाभिधानानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3"}, {"id": "B_000164", "originalText": "१६१. पद्मकमलोत्पलानि पुंसि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3"}, {"id": "B_000165", "originalText": "१६२. आहवसङ्ग्रामौ पुंसि।", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3"}, {"id": "B_000166", "originalText": "१६३. आजिः स्त्रियामेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3"}, {"id": "B_000167", "originalText": "१६४. फलजातिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3"}, {"id": "B_000168", "originalText": "१६५. वृक्षजातिः स्त्रियामेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3"}, {"id": "B_000169", "originalText": "१६६. वियज्जगत्सकृच्छकन्पृषच्छकृद्यकृदुदश्वितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3"}, {"id": "B_000170", "originalText": "(शकत् स्थाने कृषत् इति केचित्)\n१६७. नवनीतावनतानृतामृतनिमित्तवित्तचित्तपित्तव्रतरजतवृत्तपलितानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3"}, {"id": "B_000171", "originalText": "(अवनत स्थाने अवत इति केचित्)\n१६८. श्राद्धकुलिशदैवपीठकुण्डाङ्काङ्गदधिसक्थ्यक्ष्यस्थ्यास्पदाकाश\n कण्ववीजानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3"}, {"id": "B_000172", "originalText": "(क्वचित् भाण्डोऽपि)\n१६९. दैवं पुंसि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3"}, {"id": "B_000173", "originalText": "१७०. धान्याज्यशस्यरूप्यपण्यवर्ण्यधिष्ण्यहव्यकव्यकाव्यसत्यापत्य—\n मूल्यशिक्यकुड्यमद्यहर्म्यतूर्यसैन्यानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3"}, {"id": "B_000174", "originalText": "१७१. द्वन्द्वबर्हदुःखबडिशपिच्छविम्बकुटुम्बकवचकवरवृन्दराकाणि।", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3"}, {"id": "B_000175", "originalText": "(विम्ब स्थाने क्वचिद्विश्व)\n१७२. अक्षमिन्द्रिये। इति नपुंसकलिङ्गाधिकारः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3"}, {"id": "B_000176", "originalText": "अथ स्त्रीपुंसलिङ्गाधिकार।", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3"}, {"id": "B_000177", "originalText": "१७३. स्त्रीपुंसयोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3"}, {"id": "B_000178", "originalText": "१७४. गोमणियष्टिमुष्टिपाटलिबस्तिशाल्मलित्रुटिमसिमरीचयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3"}, {"id": "B_000179", "originalText": "१७५. मृत्युशीधुकर्कन्धुकिष्कुकण्डुरेणवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3"}, {"id": "B_000180", "originalText": "(मृत्यु स्थाने मन्यु,\n किष्कु स्थाने सिन्धु इति केचित्)\n१७६. गुणवचनमुकारान्तं नपुंसकञ्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3"}, {"id": "B_000181", "originalText": "१७७. अपत्यार्थस्तद्धिते। इति स्त्रीपुंसलिङ्गाधिकार॥", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3"}, {"id": "B_000182", "originalText": "अथ पुंनपुंसकलिङ्गाधिकारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3"}, {"id": "B_000183", "originalText": "१७८. पुंनपुंसकयोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3"}, {"id": "B_000184", "originalText": "१७९. धृतभूतमुस्तक्ष्वेलितैरावतपुस्तबुस्तलोहिताः।", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3"}, {"id": "B_000185", "originalText": "१८०. श‍ृङ्गार्धनिदाघोद्यमशल्यदृढाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3"}, {"id": "B_000186", "originalText": "१८१. व्रजकुञ्जकुथकूर्चप्रस्थदर्पार्भार्धर्चदर्भपुच्छाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3"}, {"id": "B_000187", "originalText": "१८२. कबन्धौषधायुधान्ताः।", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3"}, {"id": "B_000188", "originalText": "१८३. दण्डमण्डखण्डशवसैन्धवपार्श्वकाशकुशकाशाङ्कुशकुलिशाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3"}, {"id": "B_000189", "originalText": "१८४. गृहमेहदेहपट्टपटहाष्टापदार्बुदककुदाश्च। इति पुंनपुंसकलिङ्गाधिकारः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3"}, {"id": "B_000190", "originalText": "अथ अविशिष्टलिङ्गाधिकारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3"}, {"id": "B_000191", "originalText": "१८५. अविशिष्टलिङ्गम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3"}, {"id": "B_000192", "originalText": "१८६. अव्ययं कतियुष्मदस्मदः।", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3"}, {"id": "B_000193", "originalText": "(कति स्थाने डति इति केचित्)\n१८७. ष्णान्ता सङ्ख्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3"}, {"id": "B_000194", "originalText": "१८८. गुणवचनञ्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3"}, {"id": "B_000195", "originalText": "१८९. कृत्याश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3"}, {"id": "B_000196", "originalText": "१९०. करणाधिकरणयोर्ल्युट्।", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3"}, {"id": "B_000197", "originalText": "१९१. सर्वादीनि सर्वनामानि। इति अविशिष्टलिङ्गाधिकारः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000197.mp3"}, {"id": "B_000198", "originalText": "इति महर्षिपाणिनिप्रणीतं लिङ्गानुशासनं सम्पूर्णम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000198.mp3"}];
        const contentDiv = document.getElementById('content');
        const audioPlayer = document.getElementById('audio-player');
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioPlayer.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentIndex = -1;

        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => playAudio(index);
            contentDiv.appendChild(div);
        });

        function playAudio(index) {
            if (index < 0 || index >= manifest.length) return;
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            const item = manifest[currentIndex];
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            // Build the URL to stream from Cloudflare R2 Worker
            // Example: https://worker.url/BucketName/Book.zip/file.mp3
            audioPlayer.src = WORKER_URL + '/' + BUCKET_NAME + '/' + ZIP_NAME + '/' + item.audioFile;
            audioPlayer.playbackRate = document.getElementById('speed-slider').value;
            audioPlayer.play().catch(e => console.log("Audio play error:", e));
        }

        audioPlayer.onended = () => { playAudio(currentIndex + 1); };
